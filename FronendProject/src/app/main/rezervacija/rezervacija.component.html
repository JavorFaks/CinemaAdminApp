<div class="detail-panel">

  <div class="detail-header-row">
    <h3>Rezervacije - sala #{{ childSelectedSala.id }}</h3>
    <button class="btn-add" (click)="openDialog(1)">
      <mat-icon>add</mat-icon>
      Dodaj rezervaciju
    </button>
  </div>

  <section class="table-panel">
    <table mat-table matSort (matSortChange)="onSortChange($event)" [dataSource]="dataSource">

      <ng-container matColumnDef="id">
        <th mat-header-cell mat-sort-header *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let row">{{ row.id }}</td>
      </ng-container>

      <ng-container matColumnDef="datum">
        <th mat-header-cell mat-sort-header *matHeaderCellDef>Datum</th>
        <td mat-cell *matCellDef="let row">{{ row.datum }}</td>
      </ng-container>

      <ng-container matColumnDef="brojOsoba">
        <th mat-header-cell mat-sort-header *matHeaderCellDef>Broj osoba</th>
        <td mat-cell *matCellDef="let row">{{ row.brojOsoba }}</td>
      </ng-container>

      <ng-container matColumnDef="cenaKarte">
        <th mat-header-cell mat-sort-header *matHeaderCellDef>Cena karte</th>
        <td mat-cell *matCellDef="let row">{{ row.cenaKarte }}</td>
      </ng-container>

      <ng-container matColumnDef="placeno">
        <th mat-header-cell mat-sort-header *matHeaderCellDef>Placeno</th>
        <td mat-cell *matCellDef="let row">{{ row.placeno ? 'Da' : 'Ne' }}</td>
      </ng-container>

      <ng-container matColumnDef="film">
        <th mat-header-cell *matHeaderCellDef>Film</th>
        <td mat-cell *matCellDef="let row">{{ row.film?.naziv }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button (click)="openDialog(2, row)">
            <mat-icon class="icon-edit" aria-label="Edit">edit</mat-icon>
          </button>
          <button mat-icon-button (click)="openDialog(3, row)">
            <mat-icon class="icon-delete" aria-label="Delete">delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator
      [length]="totalElements"
      [pageIndex]="pageIndex"
      [pageSize]="pageSize"
      [pageSizeOptions]="[3,5,10]"
      showFirstLastButtons
      (page)="onPageChange($event)">
    </mat-paginator>
  </section>

</div>
