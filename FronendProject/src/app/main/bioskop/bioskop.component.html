<div class="page-container">

  <div class="page-header-row">
    <div>
      <h1>Bioskopi</h1>
      <p class="page-subtitle">{{ totalElements }} {{ totalElements === 1 ? 'bioskop' : 'bioskopa' }}</p>
    </div>
    <button class="btn-add" (click)="openDialog(1)">
      <mat-icon>add</mat-icon>
      Dodaj bioskop
    </button>
  </div>

  <div class="search-bar">
    <mat-icon>search</mat-icon>
    <input
      type="text"
      placeholder="Pretrazi bioskope po nazivu..."
      maxlength="100"
      [(ngModel)]="filterNaziv"
      (ngModelChange)="onNazivChange($event)"
    >
  </div>

  <div class="page-layout">

    <section class="table-panel">
      <div class="table-scroll">
        <table mat-table matSort (matSortChange)="onSortChange($event)" [dataSource]="dataSource">

          <ng-container matColumnDef="id">
            <th mat-header-cell mat-sort-header *matHeaderCellDef>ID</th>
            <td mat-cell *matCellDef="let row">{{ row.id }}</td>
          </ng-container>

          <ng-container matColumnDef="naziv">
            <th mat-header-cell mat-sort-header *matHeaderCellDef>Naziv</th>
            <td mat-cell *matCellDef="let row">{{ row.naziv }}</td>
          </ng-container>

          <ng-container matColumnDef="adresa">
            <th mat-header-cell mat-sort-header *matHeaderCellDef>Adresa</th>
            <td mat-cell *matCellDef="let row">{{ row.adresa }}</td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let row">
              <button mat-icon-button (click)="openDialog(2, row)">
                <mat-icon class="icon-edit" aria-label="Edit">edit</mat-icon>
              </button>
              <button mat-icon-button (click)="openDialog(3, row)">
                <mat-icon class="icon-delete" aria-label="Delete">delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      </div>
      <mat-paginator
        [length]="totalElements"
        [pageIndex]="pageIndex"
        [pageSize]="pageSize"
        [pageSizeOptions]="[3,5,10]"
        showFirstLastButtons
        (page)="onPageChange($event)">
      </mat-paginator>
    </section>

    <aside class="filters-panel">
      <h3>Filteri</h3>

      <mat-form-field>
        <mat-label>Adresa</mat-label>
        <input matInput type="text" [(ngModel)]="filterAdresa" maxlength="100"/>
      </mat-form-field>

      <div class="filter-actions">
        <button class="btn-apply" (click)="applyFilters()">Primijeni</button>
        <button matButton (click)="resetFilters()">Resetuj</button>
      </div>
    </aside>
  </div>

</div>
